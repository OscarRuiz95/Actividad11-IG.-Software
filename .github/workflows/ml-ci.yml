name: CI – BovWeight ML Service (Python/Flask)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Tests & Lint
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Python 3.11
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Caché de dependencias pip
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ml-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Instalar dependencias (sin ultralytics para agilizar CI)
      - name: Instalar dependencias
        working-directory: ml-service
        run: |
          pip install --upgrade pip
          # Instalar dependencias livianas para CI (ultralytics es pesado)
          pip install flask pytest pytest-flask pillow numpy

      # 5. Verificar que la app Flask importa correctamente
      - name: Verificar imports de la app
        working-directory: ml-service
        run: python -c "import flask; print('Flask OK:', flask.__version__)"

      # 6. Ejecutar pruebas unitarias del microservicio
      - name: Ejecutar pruebas pytest
        working-directory: ml-service
        run: |
          # Si existen tests, correrlos; si no, verificar que app.py al menos parsea
          if [ -d tests ]; then
            pytest tests/ -v
          else
            python -m py_compile app.py detector.py
            echo "Sintaxis OK – no hay suite de tests todavía"
          fi
